name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege for the default GITHUB_TOKEN: the build only reads.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build, test, and attach sources and javadoc
        # The AgentSpaces 0.4.0 artifacts (agentspaces-connect-core and
        # agentspaces-runtime) resolve from Maven Central. The tests use a local
        # HTTP server for the Worker and need no other network. The publication
        # profile runs unsigned here, so a javadoc or packaging problem fails the
        # pull request rather than the release.
        run: mvn -B -ntp verify -Pcentral-publish -Dgpg.skip=true
